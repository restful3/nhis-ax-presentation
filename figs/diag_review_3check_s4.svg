<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 880 286">
  <defs>
    <linearGradient id="rev-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rev-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rev-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Card 1: 통계 숫자 -->
  <g transform="translate(30,60)">
    <rect x="0" y="0" width="260" height="270" fill="url(#rev-1)" stroke="#0d9488" stroke-width="2" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#0d9488"/>
    <text x="40" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">①</text>
    <text x="80" y="35" font-size="14" font-weight="700" fill="#0f766e">통계 숫자</text>
    <text x="80" y="52" font-size="10" fill="#115e59">분류 결과와 일치하나?</text>

    <line x1="20" y1="75" x2="240" y2="75" stroke="#0d9488" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="100" font-size="10" font-weight="600" fill="#0f766e">무엇을 본다</text>
    <text x="20" y="118" font-size="10" fill="#1f2937">본문·차트의 모든 수치가</text>
    <text x="20" y="132" font-size="10" fill="#1f2937">첨부한 분류 결과와</text>
    <text x="20" y="146" font-size="10" fill="#1f2937">맞는지 확인</text>

    <text x="20" y="172" font-size="10" font-weight="600" fill="#0f766e">확인 방법</text>
    <text x="20" y="190" font-size="10" fill="#1f2937">분류 결과 파일과</text>
    <text x="20" y="204" font-size="10" fill="#1f2937">한 번 대조</text>

    <rect x="20" y="222" width="220" height="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="130" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#115e59">불일치 시 — 후속 부탁으로</text>
    <text x="130" y="253" text-anchor="middle" font-size="10" fill="#115e59">재집계해 본문·표·차트 일치</text>
  </g>

  <!-- Card 2: 근거 실재성 -->
  <g transform="translate(310,60)">
    <rect x="0" y="0" width="260" height="270" fill="url(#rev-2)" stroke="#0d9488" stroke-width="2" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#0d9488"/>
    <text x="40" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">②</text>
    <text x="80" y="35" font-size="14" font-weight="700" fill="#0f766e">근거 실재성</text>
    <text x="80" y="52" font-size="10" fill="#115e59">출처 URL이 실제로 있나?</text>

    <line x1="20" y1="75" x2="240" y2="75" stroke="#0d9488" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="100" font-size="10" font-weight="600" fill="#0f766e">무엇을 본다</text>
    <text x="20" y="118" font-size="10" fill="#1f2937">웹 검색 출처 URL을</text>
    <text x="20" y="132" font-size="10" fill="#1f2937">클릭해 실제 페이지가</text>
    <text x="20" y="146" font-size="10" fill="#1f2937">있는지 확인</text>

    <text x="20" y="172" font-size="10" font-weight="600" fill="#0f766e">확인 방법</text>
    <text x="20" y="190" font-size="10" fill="#1f2937">각 권고의 각주 URL을</text>
    <text x="20" y="204" font-size="10" fill="#1f2937">1건씩 직접 클릭</text>

    <rect x="20" y="222" width="220" height="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="130" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#115e59">1건이라도 깨지면</text>
    <text x="130" y="253" text-anchor="middle" font-size="10" fill="#115e59">그 권고는 보류</text>
  </g>

  <!-- Card 3: 권고 판단 -->
  <g transform="translate(590,60)">
    <rect x="0" y="0" width="260" height="270" fill="url(#rev-3)" stroke="#0d9488" stroke-width="2" rx="10"/>
    <circle cx="40" cy="40" r="22" fill="#0d9488"/>
    <text x="40" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">③</text>
    <text x="80" y="35" font-size="14" font-weight="700" fill="#0f766e">권고 판단</text>
    <text x="80" y="52" font-size="10" fill="#115e59">우리 부서가 실행 가능한가?</text>

    <line x1="20" y1="75" x2="240" y2="75" stroke="#0d9488" stroke-width="0.5" stroke-dasharray="3,3"/>

    <text x="20" y="100" font-size="10" font-weight="600" fill="#0f766e">무엇을 본다</text>
    <text x="20" y="118" font-size="10" fill="#1f2937">권고가 우리 부서</text>
    <text x="20" y="132" font-size="10" fill="#1f2937">권한·예산 안에서 실제</text>
    <text x="20" y="146" font-size="10" fill="#1f2937">실행 가능한지 확인</text>

    <text x="20" y="172" font-size="10" font-weight="600" fill="#0f766e">확인 방법</text>
    <text x="20" y="190" font-size="10" fill="#1f2937">권고 1건씩 짚으며</text>
    <text x="20" y="204" font-size="10" fill="#1f2937">담당자가 직접 판단</text>

    <rect x="20" y="222" width="220" height="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="1" rx="4"/>
    <text x="130" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">권한 밖이면 잘라내거나</text>
    <text x="130" y="253" text-anchor="middle" font-size="10" fill="#0f766e">"본부 건의"로 따로 표시</text>
  </g>
</svg>
