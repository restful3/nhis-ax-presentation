<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 54 826 232">
  <!-- Box 1: 룰기반 -->
  <g transform="translate(24,60)">
    <rect x="0" y="0" width="142" height="116" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="71" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">① 룰기반</text>
    <line x1="20" y1="38" x2="122" y2="38" stroke="#e2e8f0" stroke-width="1"/>
    <text x="71" y="61" text-anchor="middle" font-size="9.8" fill="#374151">사람이 규칙을</text>
    <text x="71" y="79" text-anchor="middle" font-size="9.8" fill="#374151">직접 입력 (if-then)</text>
    <text x="71" y="99" text-anchor="middle" font-size="9" fill="#6b7280">규칙 밖은 처리 불가</text>
  </g>
  <text x="177" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#0d9488">→</text>
  <!-- Box 2: 머신러닝 -->
  <g transform="translate(188,60)">
    <rect x="0" y="0" width="142" height="116" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="71" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">② 머신러닝</text>
    <line x1="20" y1="38" x2="122" y2="38" stroke="#e2e8f0" stroke-width="1"/>
    <text x="71" y="61" text-anchor="middle" font-size="9.8" fill="#374151">데이터에서 패턴을</text>
    <text x="71" y="79" text-anchor="middle" font-size="9.8" fill="#374151">스스로 학습</text>
    <text x="71" y="99" text-anchor="middle" font-size="9" fill="#6b7280">분류·예측 자동화</text>
  </g>
  <text x="341" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#0d9488">→</text>
  <!-- Box 3: 딥러닝 -->
  <g transform="translate(352,60)">
    <rect x="0" y="0" width="142" height="116" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="71" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">③ 딥러닝</text>
    <line x1="20" y1="38" x2="122" y2="38" stroke="#e2e8f0" stroke-width="1"/>
    <text x="71" y="61" text-anchor="middle" font-size="9.8" fill="#374151">심층 신경망 학습으로</text>
    <text x="71" y="79" text-anchor="middle" font-size="9.8" fill="#374151">이미지·음성 인식 도약</text>
    <text x="71" y="99" text-anchor="middle" font-size="9" fill="#6b7280">AI 성능의 분기점</text>
  </g>
  <text x="505" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#0d9488">→</text>
  <!-- Box 4: 생성형 AI -->
  <g transform="translate(516,60)">
    <rect x="0" y="0" width="142" height="116" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="71" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">④ 생성형 AI</text>
    <line x1="20" y1="38" x2="122" y2="38" stroke="#99f6e4" stroke-width="1"/>
    <text x="71" y="61" text-anchor="middle" font-size="9.8" fill="#374151">글·이미지·코드를</text>
    <text x="71" y="79" text-anchor="middle" font-size="9.8" fill="#374151">스스로 생성</text>
    <text x="71" y="99" text-anchor="middle" font-size="9" fill="#6b7280">ChatGPT — 누구나 사용</text>
  </g>
  <text x="669" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#0d9488">→</text>
  <!-- Box 5: AX -->
  <g transform="translate(680,60)">
    <rect x="0" y="0" width="142" height="116" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="2.5" rx="8"/>
    <text x="71" y="27" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d9488">⑤ 에이전틱 AI</text>
    <line x1="20" y1="38" x2="122" y2="38" stroke="#99f6e4" stroke-width="1"/>
    <text x="71" y="61" text-anchor="middle" font-size="9.8" fill="#374151">AI를 업무에 적용</text>
    <text x="71" y="79" text-anchor="middle" font-size="9.8" fill="#374151">사람 + AI 역할 분담</text>
    <text x="71" y="99" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">지금, 우리의 단계</text>
  </g>
  <!-- 연도 축 -->
  <line x1="24" y1="200" x2="822" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="834,200 822,195 822,205" fill="#9ca3af"/>
  <!-- 박스→축 연결선 + 마디 -->
  <line x1="95" y1="176" x2="95" y2="195" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="259" y1="176" x2="259" y2="195" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="423" y1="176" x2="423" y2="195" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="587" y1="176" x2="587" y2="195" stroke="#99f6e4" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="751" y1="176" x2="751" y2="195" stroke="#99f6e4" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="95" cy="200" r="5" fill="#94a3b8"/>
  <circle cx="259" cy="200" r="5" fill="#94a3b8"/>
  <circle cx="423" cy="200" r="5" fill="#94a3b8"/>
  <circle cx="587" cy="200" r="5" fill="#2dd4bf"/>
  <circle cx="751" cy="200" r="5" fill="#0d9488"/>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="#6b7280">1980년대</text>
  <text x="259" y="222" text-anchor="middle" font-size="10" fill="#6b7280">2000년대</text>
  <text x="423" y="222" text-anchor="middle" font-size="10" fill="#6b7280">2012</text>
  <text x="587" y="222" text-anchor="middle" font-size="10" fill="#6b7280">2022</text>
  <text x="751" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d9488">2026</text>
  <!-- 하단 요약 띠 -->
  <g transform="translate(24,236)">
    <rect x="0" y="0" width="798" height="40" fill="#5eead4" fill-opacity="0.35" stroke="#0d9488" stroke-width="1.5" rx="6"/>
    <text x="399" y="25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f4844">AI 발전 60여 년 — 이제 AI가 스스로 계획하고 일을 수행하는 다섯 번째 단계, 에이전틱 AI</text>
  </g>
</svg>
