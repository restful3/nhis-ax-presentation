<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 80 760 220">
  <defs>
    <linearGradient id="bg-nai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 나이스-콜 -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="320" height="200" fill="url(#bg-nai)" stroke="#0d9488" stroke-width="1.8" rx="10"/>
    <text x="160" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0d9488">나이스-콜</text>
    <text x="160" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">대국민 AI 상담 (외부)</text>
    <line x1="30" y1="62" x2="290" y2="62" stroke="#0d9488" stroke-width="0.6"/>

    <rect x="20" y="74" width="280" height="38" fill="#fff" stroke="#0d9488" stroke-width="0.8" rx="6"/>
    <text x="160" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">규모</text>
    <text x="160" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">300 회선</text>

    <rect x="20" y="118" width="280" height="36" fill="#fff" stroke="#0d9488" stroke-width="0.6" rx="6"/>
    <text x="160" y="135" text-anchor="middle" font-size="10" fill="#374151">국민이 전화하면</text>
    <text x="160" y="148" text-anchor="middle" font-size="10" fill="#374151">AI가 1차 응대</text>

    <rect x="20" y="160" width="280" height="32" fill="#0d9488" rx="6"/>
    <text x="160" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">AX 단계 매핑 — 2단계 자동 분류 + 자동 응대</text>
  </g>

  <!-- 나이스-메이트 -->
  <g transform="translate(420,90)">
    <rect x="0" y="0" width="320" height="200" fill="url(#bg-nai)" stroke="#0d9488" stroke-width="1.8" rx="10"/>
    <text x="160" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0d9488">나이스-메이트</text>
    <text x="160" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">RAG 업무비서 (내부망)</text>
    <line x1="30" y1="62" x2="290" y2="62" stroke="#0d9488" stroke-width="0.6"/>

    <rect x="20" y="74" width="280" height="38" fill="#fff" stroke="#0d9488" stroke-width="0.8" rx="6"/>
    <text x="160" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">학습 자료</text>
    <text x="160" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#0d9488">법령·지침·매뉴얼 941건</text>

    <rect x="20" y="118" width="280" height="36" fill="#fff" stroke="#0d9488" stroke-width="0.6" rx="6"/>
    <text x="160" y="135" text-anchor="middle" font-size="10" fill="#374151">직원이 질문하면</text>
    <text x="160" y="148" text-anchor="middle" font-size="10" fill="#374151">법령 출처와 함께 답변</text>

    <rect x="20" y="160" width="280" height="32" fill="#0d9488" rx="6"/>
    <text x="160" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">AX 단계 매핑 — RAG = 검색 + 인용 답변</text>
  </g>
</svg>
