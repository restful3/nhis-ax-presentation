<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 60 770 240">
  <defs>
    <linearGradient id="bg-3f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bg-3f-sub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- ① 채팅창 (작업 환경) -->
  <g transform="translate(20,72)">
    <rect x="0" y="0" width="220" height="220" fill="url(#bg-3f)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">① 작업 환경</text>
    <text x="110" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Gemini Web 채팅창</text>
    <text x="110" y="82" text-anchor="middle" font-size="11" fill="#374151">하단 입력창 · 좌측 이력</text>
    <text x="110" y="102" text-anchor="middle" font-size="11" fill="#374151">+ Gem 활성 / 일회성 분기</text>
    <text x="110" y="122" text-anchor="middle" font-size="11" fill="#374151">파일 드래그 · `+` 첨부</text>
    <text x="110" y="160" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">"부탁이 들어가고</text>
    <text x="110" y="174" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">답이 나오는 화면"</text>
    <text x="110" y="200" text-anchor="middle" font-size="10" fill="#6b7280">매번 새로 — 채팅은 일회성</text>
  </g>

  <line x1="245" y1="182" x2="265" y2="182" stroke="#0d9488" stroke-width="2"/>
  <polygon points="265,178 265,186 273,182" fill="#0d9488"/>

  <!-- ② Gem (매뉴얼) -->
  <g transform="translate(278,72)">
    <rect x="0" y="0" width="244" height="220" fill="url(#bg-3f)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="122" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">② 매뉴얼</text>
    <text x="122" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Gem Instructions + Gem Knowledge</text>

    <g transform="translate(12,72)">
      <rect x="0" y="0" width="106" height="116" fill="url(#bg-3f-sub)" stroke="#0d9488" stroke-width="1" rx="6"/>
      <text x="53" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">Gem Instructions</text>
      <text x="53" y="42" text-anchor="middle" font-size="10" fill="#374151">① 역할</text>
      <text x="53" y="58" text-anchor="middle" font-size="10" fill="#374151">② 기준</text>
      <text x="53" y="74" text-anchor="middle" font-size="10" fill="#374151">③ 형식</text>
      <text x="53" y="90" text-anchor="middle" font-size="10" fill="#374151">④ 안전망</text>
      <text x="53" y="108" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">매뉴얼 본문</text>
    </g>

    <g transform="translate(126,72)">
      <rect x="0" y="0" width="106" height="116" fill="url(#bg-3f-sub)" stroke="#0d9488" stroke-width="1" rx="6"/>
      <text x="53" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">Gem Knowledge</text>
      <text x="53" y="42" text-anchor="middle" font-size="10" fill="#374151">학습 데이터</text>
      <text x="53" y="58" text-anchor="middle" font-size="10" fill="#374151">카테고리 표</text>
      <text x="53" y="74" text-anchor="middle" font-size="10" fill="#374151">기준 문서</text>
      <text x="53" y="90" text-anchor="middle" font-size="10" fill="#374151">.md·.txt·.csv·.pdf·.docx</text>
      <text x="53" y="108" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">자료함 (참고)</text>
    </g>

    <text x="122" y="208" text-anchor="middle" font-size="10" fill="#6b7280">한 번 저장 — 새 채팅마다 자동 적용</text>
  </g>

  <line x1="527" y1="182" x2="547" y2="182" stroke="#0d9488" stroke-width="2"/>
  <polygon points="547,178 547,186 555,182" fill="#0d9488"/>

  <!-- ③ 실행 (채팅 내 차트 생성) -->
  <g transform="translate(560,72)">
    <rect x="0" y="0" width="220" height="220" fill="url(#bg-3f)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">③ 실행</text>
    <text x="110" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">자연어 부탁 + 채팅 내 차트</text>
    <text x="110" y="82" text-anchor="middle" font-size="11" fill="#374151">자연어 부탁 →</text>
    <text x="110" y="102" text-anchor="middle" font-size="11" fill="#374151">분류표 · 차트 ·</text>
    <text x="110" y="122" text-anchor="middle" font-size="11" fill="#374151">측정·교정 검수</text>
    <text x="110" y="160" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">"한 채팅에서 분류·차트·</text>
    <text x="110" y="174" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">검수까지 한 흐름"</text>
    <text x="110" y="200" text-anchor="middle" font-size="10" fill="#6b7280">HITL = 측정·교정 루프</text>
  </g>
</svg>
