<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 42 750 210">
  <!-- Stage A -->
  <g transform="translate(30, 60)">
    <rect width="220" height="180" fill="#fff" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">A — Zero-shot Instructions</text>
    <line x1="20" y1="40" x2="200" y2="40" stroke="#d1d5db" stroke-width="1"/>
    <text x="110" y="60" text-anchor="middle" font-size="11" fill="#374151">역할 두 줄만</text>
    <text x="110" y="78" text-anchor="middle" font-size="11" fill="#374151">예시·기준 없음</text>
    <text x="110" y="100" text-anchor="middle" font-size="10" fill="#6b7280">분류 정확도 (10건)</text>
    <g transform="translate(27, 108)">
      <rect width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="17" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="34" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="51" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="68" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="85" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="102" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="119" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="136" width="13" height="14" fill="#e5e7eb" rx="2"/>
      <rect x="153" width="13" height="14" fill="#e5e7eb" rx="2"/>
    </g>
    <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">측정 불가</text>
    <text x="110" y="166" text-anchor="middle" font-size="9" fill="#6b7280">카테고리 임의 · 신뢰도 전부 "상"(과신)</text>
  </g>

  <!-- Arrow A -> B -->
  <line x1="255" y1="150" x2="280" y2="150" stroke="#0d9488" stroke-width="2"/>
  <polygon points="280,146 290,150 280,154" fill="#0d9488"/>
  <text x="270" y="54" text-anchor="middle" font-size="9" fill="#0d9488" font-weight="600">+ 분류 기준·형식</text>

  <!-- Stage B -->
  <g transform="translate(290, 60)">
    <rect width="220" height="180" fill="#fff" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">B — 5유형 + 출력 형식</text>
    <line x1="20" y1="40" x2="200" y2="40" stroke="#d1d5db" stroke-width="1"/>
    <text x="110" y="60" text-anchor="middle" font-size="11" fill="#374151">A + 분류 기준 5유형</text>
    <text x="110" y="78" text-anchor="middle" font-size="11" fill="#374151">새 채팅(Gem 활성) 재실행</text>
    <text x="110" y="100" text-anchor="middle" font-size="10" fill="#6b7280">분류 정확도 (10건)</text>
    <g transform="translate(27, 108)">
      <rect width="13" height="14" fill="#059669" rx="2"/>
      <rect x="17" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="34" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="51" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="68" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="85" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="102" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="119" width="13" height="14" fill="#dc2626" rx="2"/>
      <rect x="136" width="13" height="14" fill="#dc2626" rx="2"/>
      <rect x="153" width="13" height="14" fill="#dc2626" rx="2"/>
    </g>
    <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">약 7/10 정답</text>
    <text x="110" y="166" text-anchor="middle" font-size="9" fill="#6b7280">"중" 3건이 곧 오분류 3건</text>
  </g>

  <!-- Arrow B -> C -->
  <line x1="515" y1="150" x2="540" y2="150" stroke="#0d9488" stroke-width="2"/>
  <polygon points="540,146 550,150 540,154" fill="#0d9488"/>
  <text x="530" y="54" text-anchor="middle" font-size="9" fill="#0d9488" font-weight="600">+ 경계 사례 2건</text>

  <!-- Stage C -->
  <g transform="translate(550, 60)">
    <rect width="220" height="180" fill="#fff" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">C — 애매 + 경계 사례</text>
    <line x1="20" y1="40" x2="200" y2="40" stroke="#d1d5db" stroke-width="1"/>
    <text x="110" y="60" text-anchor="middle" font-size="11" fill="#374151">B + 애매 처리·경계 사례</text>
    <text x="110" y="78" text-anchor="middle" font-size="11" fill="#374151">새 채팅(Gem 활성) 재실행</text>
    <text x="110" y="100" text-anchor="middle" font-size="10" fill="#6b7280">분류 정확도 (10건)</text>
    <g transform="translate(27, 108)">
      <rect width="13" height="14" fill="#059669" rx="2"/>
      <rect x="17" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="34" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="51" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="68" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="85" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="102" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="119" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="136" width="13" height="14" fill="#059669" rx="2"/>
      <rect x="153" width="13" height="14" fill="#dc2626" rx="2"/>
    </g>
    <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">약 9/10 정답</text>
    <text x="110" y="166" text-anchor="middle" font-size="9" fill="#6b7280">경계 사례가 오분류 2건 교정</text>
  </g>
</svg>
