<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 880 374">
  <style>
    .lane-label { fill: #374151; font-family: 'Trebuchet MS', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; }
    .lane-divider { stroke: #d1d5db; stroke-width: 1; }
    .lane-divider-strong { stroke: #9ca3af; stroke-width: 1.5; }
    .ai-box { fill: #0d9488; stroke: #0d9488; }
    .hitl-box { fill: #9ca3af; stroke: #9ca3af; }
    .person-box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; }
    .node-text { font-family: 'Trebuchet MS', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    .edge { stroke: #6b7280; stroke-width: 1.6; fill: none; }
    .arrowhead { fill: #6b7280; stroke: none; }
    .hitl-mark { fill: #dc2626; font-family: 'Trebuchet MS', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; }
    .legend-text { fill: #374151; font-family: 'Trebuchet MS', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  </style>

  <text x="440" y="40" text-anchor="middle" font-size="10" fill="#6b7280">청록 = AI · 회색 = 사람(HITL·결재) · 흰색 = 사용자/접수 · ◆ = 사람 검토 게이트</text>

  <line class="lane-divider-strong" x1="130" y1="50" x2="130" y2="370"/>
  <line class="lane-divider" x1="130" y1="50" x2="870" y2="50"/>
  <line class="lane-divider" x1="130" y1="110" x2="870" y2="110"/>
  <line class="lane-divider" x1="130" y1="170" x2="870" y2="170"/>
  <line class="lane-divider" x1="130" y1="250" x2="870" y2="250"/>
  <line class="lane-divider" x1="130" y1="310" x2="870" y2="310"/>
  <line class="lane-divider" x1="130" y1="370" x2="870" y2="370"/>

  <text class="lane-label" x="65" y="84" text-anchor="middle" font-size="11">고객</text>
  <text class="lane-label" x="65" y="144" text-anchor="middle" font-size="11">접수담당</text>
  <text class="lane-label" x="65" y="204" text-anchor="middle" font-size="11" fill="#0d9488">AI</text>
  <text class="lane-label" x="65" y="218" text-anchor="middle" font-size="9" fill="#0d9488">분류·문서 AI</text>
  <text class="lane-label" x="65" y="276" text-anchor="middle" font-size="11">심사담당</text>
  <text class="lane-label" x="65" y="290" text-anchor="middle" font-size="9" fill="#6b7280">HITL ①·②</text>
  <text class="lane-label" x="65" y="344" text-anchor="middle" font-size="11">결재·발송</text>

  <rect class="person-box" x="145" y="68" width="100" height="34" rx="4"/>
  <text class="node-text" x="195" y="89" text-anchor="middle" font-size="10" fill="#374151">이의신청 제출</text>

  <rect class="person-box" x="265" y="128" width="120" height="34" rx="4"/>
  <text class="node-text" x="325" y="143" text-anchor="middle" font-size="10" fill="#374151">접수</text>
  <text class="node-text" x="325" y="156" text-anchor="middle" font-size="9" fill="#374151">+ 개인정보 마스킹</text>

  <rect class="ai-box" x="405" y="188" width="140" height="44" rx="4"/>
  <text class="node-text" x="475" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">분류 AI: 5유형 분류</text>
  <text class="node-text" x="475" y="218" text-anchor="middle" font-size="9" fill="#fff">출력: 유형 + 신뢰도</text>

  <rect class="ai-box" x="565" y="188" width="180" height="44" rx="4"/>
  <text class="node-text" x="655" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">문서 AI: 참조 답변서 RAG</text>
  <text class="node-text" x="655" y="218" text-anchor="middle" font-size="9" fill="#fff">+ 초안 생성 + 법령 인용</text>

  <rect class="hitl-box" x="405" y="268" width="140" height="34" rx="4"/>
  <text class="node-text" x="475" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">HITL ① 신뢰도 &lt; 0.7</text>
  <text class="node-text" x="475" y="296" text-anchor="middle" font-size="9" fill="#fff">유형 재확인 (Lv.4)</text>

  <rect class="hitl-box" x="565" y="268" width="180" height="34" rx="4"/>
  <text class="node-text" x="655" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">HITL ② 법령 조항 검증</text>
  <text class="node-text" x="655" y="296" text-anchor="middle" font-size="9" fill="#fff">조항 번호·내용 확인 (Lv.4)</text>

  <rect class="hitl-box" x="765" y="328" width="100" height="34" rx="4"/>
  <text class="node-text" x="815" y="343" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">결재 → 발송</text>
  <text class="node-text" x="815" y="356" text-anchor="middle" font-size="9" fill="#fff">(Lv.4)</text>

  <text class="hitl-mark" x="546" y="280" font-size="14">◆</text>
  <text class="hitl-mark" x="746" y="280" font-size="14">◆</text>
  <text class="hitl-mark" x="746" y="340" font-size="14">◆</text>

  <line class="edge" x1="245" y1="92" x2="265" y2="138"/>
  <polygon class="arrowhead" points="266,140 258,134 267,130"/>

  <line class="edge" x1="385" y1="148" x2="405" y2="204"/>
  <polygon class="arrowhead" points="406,206 398,199 407,196"/>

  <line class="edge" x1="475" y1="232" x2="475" y2="266"/>
  <polygon class="arrowhead" points="475,268 470,259 481,259"/>

  <line class="edge" x1="545" y1="284" x2="565" y2="220"/>
  <polygon class="arrowhead" points="566,218 568,228 558,225"/>

  <line class="edge" x1="655" y1="232" x2="655" y2="266"/>
  <polygon class="arrowhead" points="655,268 650,259 661,259"/>

  <line class="edge" x1="745" y1="290" x2="765" y2="340"/>
  <polygon class="arrowhead" points="766,342 758,335 767,332"/>

  <text class="legend-text" x="135" y="395" font-size="9">시간 흐름 →</text>
  <text class="legend-text" x="440" y="395" text-anchor="middle" font-size="9" fill="#6b7280">lane 을 넘는 화살표 = 인계 지점 (§5.1 swimlane 규칙)</text>
</svg>
