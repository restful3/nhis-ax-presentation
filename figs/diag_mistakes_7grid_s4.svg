<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216">
  <!-- 자주 하는 실수 5가지 — 1줄 5카드, 본 발표 팔레트(흰/회색 카드 + teal 액센트, 빨강 ✕ 뱃지) -->

  <!-- 1: 분류 라벨 그대로 박힘 -->
  <g transform="translate(19,28)">
    <rect x="0" y="0" width="158" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/>
    <circle cx="79" cy="40" r="15" fill="#dc2626"/>
    <text x="79" y="45.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕</text>
    <text x="79" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">분류 라벨 그대로 박힘</text>
    <line x1="22" y1="106" x2="136" y2="106" stroke="#e5e7eb" stroke-width="1"/>
    <text x="79" y="134" text-anchor="middle" font-size="9" fill="#374151"><tspan fill="#0d9488" font-weight="700">→ </tspan>템플릿에 라벨 한국어로 풀기</text>
  </g>

  <!-- 2: 차트 숫자 어긋남 -->
  <g transform="translate(190,28)">
    <rect x="0" y="0" width="158" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/>
    <circle cx="79" cy="40" r="15" fill="#dc2626"/>
    <text x="79" y="45.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕</text>
    <text x="79" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">차트 숫자 어긋남</text>
    <line x1="22" y1="106" x2="136" y2="106" stroke="#e5e7eb" stroke-width="1"/>
    <text x="79" y="134" text-anchor="middle" font-size="9" fill="#374151"><tspan fill="#0d9488" font-weight="700">→ </tspan>본문·차트 한 부탁에 함께</text>
  </g>

  <!-- 3: 본문 통계 불일치 -->
  <g transform="translate(361,28)">
    <rect x="0" y="0" width="158" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/>
    <circle cx="79" cy="40" r="15" fill="#dc2626"/>
    <text x="79" y="45.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕</text>
    <text x="79" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">본문 통계 불일치</text>
    <line x1="22" y1="106" x2="136" y2="106" stroke="#e5e7eb" stroke-width="1"/>
    <text x="79" y="134" text-anchor="middle" font-size="9" fill="#374151"><tspan fill="#0d9488" font-weight="700">→ </tspan>처음부터 다시 세어 일치</text>
  </g>

  <!-- 4: 근거 URL 404 -->
  <g transform="translate(532,28)">
    <rect x="0" y="0" width="158" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/>
    <circle cx="79" cy="40" r="15" fill="#dc2626"/>
    <text x="79" y="45.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕</text>
    <text x="79" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">근거 URL 404</text>
    <line x1="22" y1="106" x2="136" y2="106" stroke="#e5e7eb" stroke-width="1"/>
    <text x="79" y="134" text-anchor="middle" font-size="9" fill="#374151"><tspan fill="#0d9488" font-weight="700">→ </tspan>URL 클릭해 실재 검증</text>
  </g>

  <!-- 5: 부서 밖 권고 -->
  <g transform="translate(703,28)">
    <rect x="0" y="0" width="158" height="160" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="9"/>
    <circle cx="79" cy="40" r="15" fill="#dc2626"/>
    <text x="79" y="45.5" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">✕</text>
    <text x="79" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">실행 못 할 권고</text>
    <line x1="22" y1="106" x2="136" y2="106" stroke="#e5e7eb" stroke-width="1"/>
    <text x="79" y="134" text-anchor="middle" font-size="9" fill="#374151"><tspan fill="#0d9488" font-weight="700">→ </tspan>실행 가능한 것만 권고로</text>
  </g>
</svg>
