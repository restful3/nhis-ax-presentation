<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 80 760 190">
  <defs>
    <linearGradient id="bg-law" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 조항 1: 제7조 -->
  <g transform="translate(30,90)">
    <rect x="0" y="0" width="180" height="170" fill="url(#bg-law)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">제7조</text>
    <text x="90" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">공공조달</text>
    <text x="90" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">우선 고려</text>
    <line x1="20" y1="78" x2="160" y2="78" stroke="#0d9488" stroke-width="0.6"/>
    <text x="90" y="98" text-anchor="middle" font-size="10" fill="#374151">국가기관이 AI 제품·</text>
    <text x="90" y="113" text-anchor="middle" font-size="10" fill="#374151">서비스 구매 시 우선</text>
    <rect x="14" y="130" width="152" height="32" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="0.6" rx="4"/>
    <text x="90" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">공단 의미</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" fill="#374151">"AI 도입은 권장 방향"</text>
  </g>

  <!-- 조항 2: 제7조의2 (강조) -->
  <g transform="translate(220,90)">
    <rect x="0" y="0" width="180" height="170" fill="#0d9488" fill-opacity="0.22" stroke="#0d9488" stroke-width="2.2" rx="8"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">제7조의2 ★</text>
    <text x="90" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">담당자</text>
    <text x="90" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">면책 조항</text>
    <line x1="20" y1="78" x2="160" y2="78" stroke="#0d9488" stroke-width="0.6"/>
    <text x="90" y="98" text-anchor="middle" font-size="10" fill="#374151">고의·중과실 없으면</text>
    <text x="90" y="113" text-anchor="middle" font-size="10" fill="#374151">배상 책임 면책</text>
    <rect x="14" y="130" width="152" height="32" fill="#0d9488" stroke="#0d9488" stroke-width="0.6" rx="4"/>
    <text x="90" y="146" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">공단 의미</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">"잘못되면 누가" 해소</text>
  </g>

  <!-- 조항 3: 고영향 영향평가 -->
  <g transform="translate(410,90)">
    <rect x="0" y="0" width="180" height="170" fill="url(#bg-law)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">고영향 AI</text>
    <text x="90" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">영향평가</text>
    <text x="90" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">우선 구매</text>
    <line x1="20" y1="78" x2="160" y2="78" stroke="#0d9488" stroke-width="0.6"/>
    <text x="90" y="98" text-anchor="middle" font-size="10" fill="#374151">보건의료 등 고영향</text>
    <text x="90" y="113" text-anchor="middle" font-size="10" fill="#374151">분야 영향평가 통과 AI</text>
    <rect x="14" y="130" width="152" height="32" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="0.6" rx="4"/>
    <text x="90" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">공단 의미</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" fill="#374151">건강보험 = 고영향 트랙</text>
  </g>

  <!-- 조항 4: 워터마크 -->
  <g transform="translate(600,90)">
    <rect x="0" y="0" width="180" height="170" fill="url(#bg-law)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">생성형 AI</text>
    <text x="90" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">워터마크</text>
    <text x="90" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">표시 의무</text>
    <line x1="20" y1="78" x2="160" y2="78" stroke="#0d9488" stroke-width="0.6"/>
    <text x="90" y="98" text-anchor="middle" font-size="10" fill="#374151">이미지·영상·텍스트에</text>
    <text x="90" y="113" text-anchor="middle" font-size="10" fill="#374151">AI 생성물 표시</text>
    <rect x="14" y="130" width="152" height="32" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="0.6" rx="4"/>
    <text x="90" y="146" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">공단 의미</text>
    <text x="90" y="158" text-anchor="middle" font-size="9" fill="#374151">문서 자동 생성 표기 절차</text>
  </g>
</svg>
