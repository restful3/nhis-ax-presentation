<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 62 692 196">
  <defs>
    <linearGradient id="dx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ax-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <g transform="translate(60,70)">
    <rect x="0" y="0" width="270" height="180" fill="url(#dx-bg)" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="135" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">DX · 2000년대 ~</text>
    <text x="135" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">디지털 전환</text>
    <text x="135" y="72" text-anchor="middle" font-size="11" fill="#374151">종이 민원장부 → 전산 시스템</text>
    <text x="135" y="92" text-anchor="middle" font-size="11" fill="#374151">자격·부과 DB 구축</text>
    <text x="135" y="112" text-anchor="middle" font-size="11" fill="#374151">EDW 빅데이터 인프라</text>
    <text x="135" y="148" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">"종이를 없앤 혁신"</text>
    <text x="135" y="166" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">→ 공단 DX 수준은 매우 높음</text>
  </g>

  <line x1="335" y1="160" x2="465" y2="160" stroke="#0d9488" stroke-width="2.5"/>
  <polygon points="475,160 465,154 465,166" fill="#0d9488" stroke="none"/>
  <text x="400" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">+ AI 인턴</text>

  <g transform="translate(485,70)">
    <rect x="0" y="0" width="220" height="180" fill="url(#ax-bg)" stroke="#0d9488" stroke-width="1.8" rx="8"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#0d9488">AX · 2026년 ~</text>
    <text x="110" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">AI 전환</text>
    <text x="110" y="72" text-anchor="middle" font-size="11" fill="#374151">민원 1,400만 건 자동 분류</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#374151">보고서·안내문 초안 생성</text>
    <text x="110" y="112" text-anchor="middle" font-size="11" fill="#374151">체납 위험군 자동 분류</text>
    <text x="110" y="148" text-anchor="middle" font-size="10" fill="#0d9488" font-style="italic">"반복 작업을 인턴이 대신"</text>
    <text x="110" y="166" text-anchor="middle" font-size="10" fill="#0d9488" font-style="italic">→ DX 위에서만 작동</text>
  </g>
