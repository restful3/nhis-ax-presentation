<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 48 730 362">
  <defs>
    <linearGradient id="bg-u" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- LEFT: Unstructured -->
  <g transform="translate(40,55)">
    <rect x="0" y="0" width="320" height="240" fill="url(#bg-u)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">비정형 텍스트 (이의신청 민원)</text>
    <text x="160" y="44" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">"보험료가 잘못 부과됐어요…"</text>

    <!-- Note papers stack -->
    <g transform="translate(28,60)">
      <rect x="2" y="0" width="260" height="22" fill="#fff" stroke="#94a3b8" stroke-width="0.6" rx="2"/>
      <rect x="2" y="26" width="260" height="22" fill="#fff" stroke="#94a3b8" stroke-width="0.6" rx="2"/>
      <rect x="2" y="52" width="260" height="22" fill="#fff" stroke="#94a3b8" stroke-width="0.6" rx="2"/>
      <rect x="2" y="78" width="260" height="22" fill="#fff" stroke="#94a3b8" stroke-width="0.6" rx="2"/>
      <rect x="2" y="104" width="260" height="22" fill="#fff" stroke="#94a3b8" stroke-width="0.6" rx="2"/>
      <text x="14" y="15" font-size="9" fill="#374151">자격변동 — 피부양자 자격 상실 처분 부당</text>
      <text x="14" y="41" font-size="9" fill="#374151">보험료 산정 — 소득 줄었는데 과다 부과</text>
      <text x="14" y="67" font-size="9" fill="#374151">급여 제한 — 산정특례 거부 사유 불복</text>
      <text x="14" y="93" font-size="9" fill="#374151">자격 확인 — 영문 자격확인서 발급 요청</text>
      <text x="14" y="119" font-size="9" fill="#374151">기타 — 제도 일반 문의</text>
    </g>
    <text x="160" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#0d9488">자연어 이해(NLU)가 핵심</text>
  </g>

  <!-- RIGHT: Structured -->
  <g transform="translate(440,55)">
    <rect x="0" y="0" width="320" height="240" fill="url(#bg-u)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">정형 데이터 (체납 이력)</text>
    <text x="160" y="44" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">"엑셀 100건 — 직업·소득·체납기간·결과"</text>

    <!-- Excel grid: columns 70+70+80+60 = 280 -->
    <g transform="translate(20,60)">
      <!-- Header row -->
      <rect x="0" y="0" width="280" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <text x="35" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">패턴</text>
      <text x="105" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">직업</text>
      <text x="180" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">기간</text>
      <text x="250" y="14" text-anchor="middle" font-size="9" font-weight="600" fill="#1f2937">결과</text>
      <line x1="70" y1="0" x2="70" y2="130" stroke="#cbd5e1" stroke-width="0.5"/>
      <line x1="140" y1="0" x2="140" y2="130" stroke="#cbd5e1" stroke-width="0.5"/>
      <line x1="220" y1="0" x2="220" y2="130" stroke="#cbd5e1" stroke-width="0.5"/>
      <!-- Data rows -->
      <rect x="0" y="20" width="280" height="22" fill="#fff" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="6" y="34" font-size="9" fill="#374151">A 일시적</text>
      <text x="76" y="34" font-size="9" fill="#374151">일용직</text>
      <text x="146" y="34" font-size="9" fill="#374151">1~2개월</text>
      <text x="226" y="34" font-size="9" fill="#374151">완납</text>
      <rect x="0" y="42" width="280" height="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="6" y="56" font-size="9" fill="#374151">B 곤란</text>
      <text x="76" y="56" font-size="9" fill="#374151">무직</text>
      <text x="146" y="56" font-size="9" fill="#374151">3~8개월</text>
      <text x="226" y="56" font-size="9" fill="#374151">분할납부</text>
      <rect x="0" y="64" width="280" height="22" fill="#fff" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="6" y="78" font-size="9" fill="#374151">C 자영업중기</text>
      <text x="76" y="78" font-size="9" fill="#374151">자영업</text>
      <text x="146" y="78" font-size="9" fill="#374151">6~11개월</text>
      <text x="226" y="78" font-size="9" fill="#374151">장기체납</text>
      <rect x="0" y="86" width="280" height="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="6" y="100" font-size="9" fill="#374151">D 자영업고액</text>
      <text x="76" y="100" font-size="9" fill="#374151">자영업</text>
      <text x="146" y="100" font-size="9" fill="#374151">12개월+</text>
      <text x="226" y="100" font-size="9" fill="#374151">체납처분</text>
      <rect x="0" y="108" width="280" height="22" fill="#fff" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="6" y="122" font-size="9" fill="#374151">E 프리랜서</text>
      <text x="76" y="122" font-size="9" fill="#374151">프리랜서</text>
      <text x="146" y="122" font-size="9" fill="#374151">2~4개월</text>
      <text x="226" y="122" font-size="9" fill="#374151">완납</text>
    </g>
    <text x="160" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#0d9488">수치 패턴 + 규칙 추출이 핵심</text>
  </g>

  <!-- Convergence arrows — both end at the same point above unified box -->
  <line x1="200" y1="305" x2="387" y2="343" stroke="#0d9488" stroke-width="2"/>
  <polygon points="395,345 388,339 386,347" fill="#0d9488" stroke="none"/>
  <line x1="600" y1="305" x2="413" y2="343" stroke="#0d9488" stroke-width="2"/>
  <polygon points="405,345 412,339 414,347" fill="#0d9488" stroke="none"/>

  <!-- Bottom unified box -->
  <g transform="translate(220,355)">
    <rect x="0" y="0" width="360" height="50" fill="#0d9488" rx="6"/>
    <text x="180" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">동일한 AX 4단계</text>
    <text x="180" y="40" text-anchor="middle" font-size="11" fill="#fff">분석 → 자동 분류 → 보고서 → 기획 (HITL 게이트)</text>
  </g>
</svg>
