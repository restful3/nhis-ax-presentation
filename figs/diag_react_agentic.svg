<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 117 800 191">
  <defs>
    <linearGradient id="rk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- 사용자 요청 (좌측 입구) -->
  <g transform="translate(20,150)">
    <rect x="0" y="0" width="90" height="60" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.2" rx="6"/>
    <text x="45" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">사용자 요청</text>
    <text x="45" y="46" text-anchor="middle" font-size="10" fill="#374151">(민원 1건)</text>
  </g>
  <line x1="110" y1="180" x2="142" y2="180" stroke="#0d9488" stroke-width="2"/>
  <polygon points="150,180 142,176 142,184" fill="#0d9488" stroke="none"/>

  <!-- ① Thought -->
  <g transform="translate(150,125)">
    <rect x="0" y="0" width="150" height="110" fill="url(#rk-bg)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="75" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">① Thought (생각)</text>
    <text x="75" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">"어떻게 풀까?"</text>
  </g>
  <line x1="300" y1="180" x2="332" y2="180" stroke="#0d9488" stroke-width="2"/>
  <polygon points="340,180 332,176 332,184" fill="#0d9488" stroke="none"/>

  <!-- ② Action -->
  <g transform="translate(340,125)">
    <rect x="0" y="0" width="150" height="110" fill="url(#rk-bg)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="75" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">② Action (행동)</text>
    <text x="75" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">"도구를 쓰자"</text>
  </g>
  <line x1="490" y1="180" x2="522" y2="180" stroke="#0d9488" stroke-width="2"/>
  <polygon points="530,180 522,176 522,184" fill="#0d9488" stroke="none"/>

  <!-- ③ Observation -->
  <g transform="translate(530,125)">
    <rect x="0" y="0" width="150" height="110" fill="url(#rk-bg)" stroke="#0d9488" stroke-width="1.5" rx="8"/>
    <text x="75" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">③ Observation (관찰)</text>
    <text x="75" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">"결과 보니..."</text>
  </g>
  <line x1="680" y1="180" x2="712" y2="180" stroke="#0d9488" stroke-width="2"/>
  <polygon points="720,180 712,176 712,184" fill="#0d9488" stroke="none"/>

  <!-- 최종 답변 (우측 출구) -->
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="90" height="60" fill="#5eead4" fill-opacity="0.45" stroke="#0d9488" stroke-width="1.2" rx="6"/>
    <text x="45" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="#0f4844">최종 답변</text>
    <text x="45" y="46" text-anchor="middle" font-size="10" fill="#0f4844">+ HITL 검토</text>
  </g>

  <!-- 반복 루프: Observation 하단 → Thought 하단 (대칭 곡선, 점선) -->
  <path d="M 605 235 Q 605 275 415 275 Q 225 275 225 243" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="225,235 221,243 229,243" fill="#9a3412" stroke="none"/>
  <text x="415" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">반복 (필요시) — 답변이 충분해질 때까지</text>
</svg>
