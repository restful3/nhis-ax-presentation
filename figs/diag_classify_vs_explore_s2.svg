<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 780 312">
  <defs>
    <linearGradient id="bg-ox-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.025"/>
    </linearGradient>
  </defs>

  <!-- ============= 왼쪽 — 잘못된 순서 (X) ============= -->
  <rect x="20" y="10" width="365" height="292" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="34" y="22" width="112" height="24" rx="12" fill="#ef4444"/>
  <text x="90" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="0.4">잘못된 순서</text>
  <text x="371" y="39" text-anchor="end" font-size="10.5" font-weight="700" fill="#ef4444">분류부터 시작</text>

  <!-- box 1 -->
  <rect x="34" y="56" width="337" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="50" y="79" font-size="12" font-weight="700" fill="#334155">데이터 받자마자 분류부터 지시</text>
  <text x="50" y="95" font-size="10" fill="#64748b">"이걸 분류해줘"</text>
  <line x1="202" y1="103" x2="202" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,109 208,109 202,118" fill="#94a3b8"/>

  <!-- box 2 -->
  <rect x="34" y="118" width="337" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="50" y="141" font-size="12" font-weight="700" fill="#334155">AI가 임의 카테고리를 즉석 생성</text>
  <text x="50" y="157" font-size="10" fill="#64748b">근거도 기준도 없이</text>
  <line x1="202" y1="165" x2="202" y2="172" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,171 208,171 202,180" fill="#94a3b8"/>

  <!-- box 3 -->
  <rect x="34" y="180" width="337" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="50" y="203" font-size="12" font-weight="700" fill="#334155">다음 작업에 못 쓰는 자유 나열</text>
  <text x="50" y="219" font-size="10" fill="#64748b">재사용 불가 · 100명이 제각각</text>
  <line x1="202" y1="227" x2="202" y2="234" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="196,233 208,233 202,242" fill="#94a3b8"/>

  <!-- 결과 box -->
  <rect x="34" y="242" width="337" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="50" y="265" font-size="12.5" font-weight="800" fill="#b91c1c">✕  막다른 길</text>
  <text x="50" y="281" font-size="10" fill="#64748b">결측·중복·오타가 분류 결과에 그대로 묻혀 듦</text>

  <!-- ============= 오른쪽 — 올바른 순서 (O) ============= -->
  <rect x="405" y="10" width="365" height="292" rx="12" fill="url(#bg-ox-teal)" stroke="#0d9488" stroke-width="2"/>

  <rect x="419" y="22" width="112" height="24" rx="12" fill="#0d9488"/>
  <text x="475" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="0.4">올바른 순서</text>
  <text x="756" y="39" text-anchor="end" font-size="10.5" font-weight="700" fill="#0d9488">탐색부터 시작</text>

  <!-- box 1 -->
  <rect x="419" y="56" width="337" height="46" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <circle cx="443" cy="79" r="13" fill="#0d9488"/>
  <text x="443" y="84" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text>
  <text x="466" y="76" font-size="12.5" font-weight="800" fill="#0f766e">탐색 — 뭐가 들어있지?</text>
  <text x="466" y="92" font-size="10" fill="#475569">막연한 질문으로 데이터부터 살핀다</text>
  <line x1="588" y1="103" x2="588" y2="110" stroke="#0d9488" stroke-width="2"/>
  <polygon points="582,109 594,109 588,118" fill="#0d9488"/>

  <!-- box 2 -->
  <rect x="419" y="118" width="337" height="46" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <circle cx="443" cy="141" r="13" fill="#0d9488"/>
  <text x="443" y="146" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text>
  <text x="466" y="138" font-size="12.5" font-weight="800" fill="#0f766e">분류 체계 도출</text>
  <text x="466" y="154" font-size="10" fill="#475569">탐색에서 드러난 패턴·키워드로 기준을 세운다</text>
  <line x1="588" y1="165" x2="588" y2="172" stroke="#0d9488" stroke-width="2"/>
  <polygon points="582,171 594,171 588,180" fill="#0d9488"/>

  <!-- box 3 -->
  <rect x="419" y="180" width="337" height="46" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/>
  <circle cx="443" cy="203" r="13" fill="#0d9488"/>
  <text x="443" y="208" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text>
  <text x="466" y="200" font-size="12.5" font-weight="800" fill="#0f766e">분류 적용</text>
  <text x="466" y="216" font-size="10" fill="#475569">도출된 체계로 일관되게 분류한다</text>
  <line x1="588" y1="227" x2="588" y2="234" stroke="#0d9488" stroke-width="2"/>
  <polygon points="582,233 594,233 588,242" fill="#0d9488"/>

  <!-- 결과 box -->
  <rect x="419" y="242" width="337" height="46" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
  <text x="435" y="265" font-size="12.5" font-weight="800" fill="#0f766e">✓  다음 작업에 바로 사용</text>
  <text x="435" y="281" font-size="10" fill="#475569">Gem Instructions · 보고서로 그대로 이어짐</text>
