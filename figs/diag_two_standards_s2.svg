<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 780 270">
  <defs>
    <linearGradient id="bg-std-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.025"/>
    </linearGradient>
  </defs>

  <!-- ============= 카드 A — 민원 5유형 (텍스트 · 실습 A) ============= -->
  <rect x="20" y="10" width="365" height="250" fill="url(#bg-std-card)" stroke="#0d9488" stroke-width="2" rx="12"/>

  <!-- 상단: 태그 pill (solid) + 데이터 형식 -->
  <rect x="34" y="24" width="88" height="22" fill="#0d9488" rx="11"/>
  <text x="78" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" letter-spacing="0.6">민원 5유형</text>
  <text x="371" y="40" text-anchor="end" font-size="11" font-weight="700" fill="#0d9488">텍스트 · 실습 A</text>

  <!-- 제목 + 분리선 -->
  <text x="34" y="72" font-size="16" font-weight="800" fill="#1f2937">이의신청 민원 분류</text>
  <line x1="34" y1="81" x2="371" y2="81" stroke="#0d9488" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- 컬럼 헤더 -->
  <text x="34" y="100" font-size="9" font-weight="800" fill="#0d9488" letter-spacing="1.3">유형</text>
  <text x="371" y="100" text-anchor="end" font-size="9" font-weight="800" fill="#0d9488" letter-spacing="1.3">건수</text>
  <line x1="34" y1="107" x2="371" y2="107" stroke="#cbd5e1" stroke-width="0.6"/>

  <!-- rows -->
  <text x="34" y="122" font-size="11" font-weight="600" fill="#1f2937">자격 변동 이의 (직장-지역 전환)</text>
  <text x="371" y="122" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488">5</text>
  <line x1="34" y1="132" x2="371" y2="132" stroke="#e8edf2" stroke-width="1"/>

  <text x="34" y="143" font-size="11" font-weight="600" fill="#1f2937">보험료 산정 이의 (소득·재산)</text>
  <text x="371" y="143" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488">5</text>
  <line x1="34" y1="153" x2="371" y2="153" stroke="#e8edf2" stroke-width="1"/>

  <text x="34" y="164" font-size="11" font-weight="600" fill="#1f2937">급여 제한 이의 (장기 입원)</text>
  <text x="371" y="164" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488">6</text>
  <line x1="34" y1="174" x2="371" y2="174" stroke="#e8edf2" stroke-width="1"/>

  <text x="34" y="185" font-size="11" font-weight="600" fill="#1f2937">자격 확인 요청 (이중·피부양자)</text>
  <text x="371" y="185" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488">2</text>
  <line x1="34" y1="195" x2="371" y2="195" stroke="#e8edf2" stroke-width="1"/>

  <text x="34" y="206" font-size="11" font-weight="600" fill="#1f2937">기타 (절차 문의 등)</text>
  <text x="371" y="206" text-anchor="end" font-size="12.5" font-weight="700" fill="#0d9488">2</text>

  <!-- 푸터 -->
  <line x1="34" y1="220" x2="371" y2="220" stroke="#0d9488" stroke-width="0.7" stroke-opacity="0.45"/>
  <text x="34" y="237" font-size="11.5" font-weight="800" fill="#1f2937">합계 20건</text>
  <text x="371" y="237" text-anchor="end" font-size="9.5" fill="#64748b">§3 시연 1 · 실습 A 입력값</text>

  <!-- ============= 카드 B — 체납 4유형 (엑셀 · 실습 B) ============= -->
  <rect x="405" y="10" width="365" height="250" fill="url(#bg-std-card)" stroke="#0d9488" stroke-width="2" rx="12"/>

  <!-- 상단: 태그 pill (outline) + 데이터 형식 -->
  <rect x="419" y="24" width="88" height="22" fill="#fff" stroke="#0d9488" stroke-width="1.5" rx="11"/>
  <text x="463" y="39" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488" letter-spacing="0.6">체납 4유형</text>
  <text x="756" y="40" text-anchor="end" font-size="11" font-weight="700" fill="#0d9488">엑셀 · 실습 B</text>

  <!-- 제목 + 분리선 -->
  <text x="419" y="72" font-size="16" font-weight="800" fill="#1f2937">체납자 분류</text>
  <line x1="419" y1="81" x2="756" y2="81" stroke="#0d9488" stroke-width="0.7" stroke-opacity="0.45"/>

  <!-- 컬럼 헤더 -->
  <text x="419" y="100" font-size="9" font-weight="800" fill="#0d9488" letter-spacing="1.3">유형</text>
  <text x="535" y="100" font-size="9" font-weight="800" fill="#0d9488" letter-spacing="1.3">핵심 신호</text>
  <line x1="419" y1="107" x2="756" y2="107" stroke="#cbd5e1" stroke-width="0.6"/>

  <!-- rows -->
  <text x="419" y="125" font-size="11.5" font-weight="700" fill="#1f2937">경제곤란</text>
  <text x="535" y="125" font-size="10.5" fill="#475569">저소득 · 고령</text>
  <line x1="419" y1="136" x2="756" y2="136" stroke="#e8edf2" stroke-width="1"/>

  <text x="419" y="151" font-size="11.5" font-weight="700" fill="#1f2937">고의</text>
  <text x="535" y="151" font-size="10.5" fill="#475569">고소득 · 압류이력</text>
  <line x1="419" y1="162" x2="756" y2="162" stroke="#e8edf2" stroke-width="1"/>

  <text x="419" y="177" font-size="11.5" font-weight="700" fill="#1f2937">상습</text>
  <text x="535" y="177" font-size="10.5" fill="#475569">장기 · 연체 반복</text>
  <line x1="419" y1="188" x2="756" y2="188" stroke="#e8edf2" stroke-width="1"/>

  <text x="419" y="203" font-size="11.5" font-weight="700" fill="#1f2937">단기실수</text>
  <text x="535" y="203" font-size="10.5" fill="#475569">단기 · 1~2회</text>

  <!-- 푸터 -->
  <line x1="419" y1="220" x2="756" y2="220" stroke="#0d9488" stroke-width="0.7" stroke-opacity="0.45"/>
  <text x="419" y="237" font-size="10.5" font-style="italic" font-weight="600" fill="#0f766e">4분면 = 능력 × 의도 + 장기 × 단기</text>
  <text x="756" y="237" text-anchor="end" font-size="9.5" fill="#64748b">§4 실습 B 입력값</text>
</svg>
