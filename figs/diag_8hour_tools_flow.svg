<svg xmlns="http://www.w3.org/2000/svg" viewBox="63.8 42 692.6 168">
  <!-- Top tool band: Gemini Web + Gem (전 시간대 단일) -->
  <rect x="80" y="50" width="660" height="22" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1" rx="4"/>
  <text x="410" y="65" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">전 시간대 — Gemini Web + Gem (단일)</text>

  <!-- Time axis -->
  <line x1="80" y1="180" x2="740" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="200" text-anchor="middle" font-size="9" fill="#6b7280">09:00</text>
  <text x="192" y="200" text-anchor="middle" font-size="9" fill="#6b7280">10:30</text>
  <text x="296" y="200" text-anchor="middle" font-size="9" fill="#6b7280">12:00</text>
  <text x="376" y="200" text-anchor="middle" font-size="9" fill="#6b7280">13:00</text>
  <text x="492" y="200" text-anchor="middle" font-size="9" fill="#6b7280">14:30</text>
  <text x="596" y="200" text-anchor="middle" font-size="9" fill="#6b7280">16:00</text>
  <text x="740" y="200" text-anchor="middle" font-size="9" fill="#6b7280">18:00</text>

  <!-- Session 1: 09:00-10:30, 도구 무관 (개념) -->
  <g>
    <rect x="80" y="100" width="108" height="60" fill="#64748b" fill-opacity="0.15" stroke="#64748b" stroke-width="1.2" rx="5"/>
    <text x="134" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">세션 1</text>
    <text x="134" y="135" text-anchor="middle" font-size="9" fill="#374151">개념·5사례</text>
    <text x="134" y="150" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">도구 무관</text>
  </g>

  <!-- Session 2: 10:40-12:00, Gemini 일회성 채팅 -->
  <g>
    <rect x="196" y="100" width="96" height="60" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.2" rx="5"/>
    <text x="244" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">세션 2</text>
    <text x="244" y="135" text-anchor="middle" font-size="9" fill="#374151">1단계 분석</text>
    <text x="244" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">일회성 채팅</text>
  </g>

  <!-- 점심: 12:00-13:00 -->
  <g>
    <rect x="300" y="115" width="72" height="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2" rx="4"/>
    <text x="336" y="135" text-anchor="middle" font-size="9" fill="#6b7280">점심</text>
  </g>

  <!-- Session 3: 13:00-14:30, Gem 분류 -->
  <g>
    <rect x="380" y="100" width="108" height="60" fill="#0d9488" fill-opacity="0.28" stroke="#0d9488" stroke-width="1.2" rx="5"/>
    <text x="434" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">세션 3</text>
    <text x="434" y="135" text-anchor="middle" font-size="9" fill="#374151">2단계 자동 분류</text>
    <text x="434" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">Gem</text>
  </g>

  <!-- Session 4: 14:40-16:00, Gem 자동화 -->
  <g>
    <rect x="496" y="100" width="96" height="60" fill="#0d9488" fill-opacity="0.28" stroke="#0d9488" stroke-width="1.2" rx="5"/>
    <text x="544" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">세션 4</text>
    <text x="544" y="135" text-anchor="middle" font-size="9" fill="#374151">3단계 보고서</text>
    <text x="544" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">Canvas</text>
  </g>

  <!-- Session 5: 16:10-18:00, Gemini 기획 워크숍 -->
  <g>
    <rect x="600" y="100" width="140" height="60" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.2" rx="5"/>
    <text x="670" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">세션 5</text>
    <text x="670" y="135" text-anchor="middle" font-size="9" fill="#374151">4단계 기획</text>
    <text x="670" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">Gemini</text>
  </g>
</svg>
