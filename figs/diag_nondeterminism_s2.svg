<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 42 537.8 207">
  <!-- Top: prompt → AI -->
  <rect x="60" y="50" width="170" height="40" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="145" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">프롬프트</text>
  <text x="145" y="83" text-anchor="middle" font-size="9" fill="#6b7280">"이 민원 분류해줘"</text>

  <line x1="235" y1="70" x2="285" y2="70" stroke="#0d9488" stroke-width="2"/>
  <polygon points="295,70 285,65 285,75" fill="#0d9488"/>

  <rect x="300" y="50" width="170" height="40" rx="6" fill="#0d9488"/>
  <text x="385" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AI 모델</text>
  <text x="385" y="83" text-anchor="middle" font-size="9" fill="#a7f3d0">다음 단어 확률로 샘플링</text>

  <line x1="385" y1="95" x2="385" y2="115" stroke="#0d9488" stroke-width="2"/>
  <polygon points="385,125 380,115 390,115" fill="#0d9488"/>

  <!-- Section title -->
  <text x="400" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">다음에 올 단어 후보 — 매번 다른 단어가 뽑힐 수 있다</text>

  <!-- 재산 60% -->
  <text x="155" y="180" text-anchor="end" font-size="11" font-weight="700" fill="#1f2937">"재산"</text>
  <rect x="165" y="168" width="180" height="16" rx="2" fill="#0d9488"/>
  <text x="350" y="180" font-size="11" font-weight="700" fill="#0d9488">60%</text>
  <line x1="395" y1="176" x2="435" y2="176" stroke="#0d9488" stroke-width="2"/>
  <polygon points="445,176 435,171 435,181" fill="#0d9488"/>
  <text x="455" y="180" font-size="11" fill="#1f2937">"보험료 부과·조정" 카테고리</text>

  <!-- 자산 30% -->
  <text x="155" y="210" text-anchor="end" font-size="11" font-weight="700" fill="#1f2937">"자산"</text>
  <rect x="165" y="198" width="90" height="16" rx="2" fill="#0d9488" fill-opacity="0.6"/>
  <text x="260" y="210" font-size="11" font-weight="700" fill="#0d9488">30%</text>
  <line x1="395" y1="206" x2="435" y2="206" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="445,206 435,201 435,211" fill="#94a3b8"/>
  <text x="455" y="210" font-size="11" fill="#64748b">"자격 변동" 카테고리</text>

  <!-- 소득 10% -->
  <text x="155" y="240" text-anchor="end" font-size="11" font-weight="700" fill="#1f2937">"소득"</text>
  <rect x="165" y="228" width="30" height="16" rx="2" fill="#0d9488" fill-opacity="0.3"/>
  <text x="200" y="240" font-size="11" font-weight="700" fill="#0d9488">10%</text>
  <line x1="395" y1="236" x2="435" y2="236" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="445,236 435,231 435,241" fill="#94a3b8"/>
  <text x="455" y="240" font-size="11" fill="#64748b">"의료급여" 카테고리</text>
</svg>
